<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2Morrow Forgot Login</title>
    <link rel="stylesheet" href="./forgot.css">
    <link rel="stylesheet" href="https://fontawesome.com">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="https://kit.fontawesome.com/988c019cd9.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="container">
        <div class="content">

            <!-- Left Side -->
            <div class="left">
                <div class="left-content">
                    <div class="logo"><img src="./uploads/logo.png" alt="logo"></div>

                    <h2>Reset Password</h2>
                    <div class="left-text">
                        <p>Forgotten your password? Just enter your email address below and we'll send you a link to
                            reset it.</p>
                    </div>

                    <div class="box">
                        <form>
                            <div class="inputBox">
                                <input type="email" name="email" required placeholder=" "
                                    onkeyup="this.setAttribute('value', this.value);" value="">
                                <label>Email id</label>
                            </div>

                            <button type="submit">Submit</button>
                        </form>
                    </div>

                </div>
            </div>

            <!-- Right Side -->
            <div class="right">
                <div class="right-img">
                    <div class="forgot-img">
                        <img src="./uploads/forgot-password.png" alt="forgot img">
                    </div>
                </div>

            </div>

        </div>

    </div>

</body>

</html>
